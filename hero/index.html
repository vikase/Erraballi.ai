<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero film source · erraballi.ai</title>
<!--
  Source page for the erraballi.ai hero film. Everything is drawn in code: no footage, no images.
  The whole film is a pure function of time: render(t) sets every style from t, so any frame can be
  reproduced exactly. Open this page to watch it live. To film it, see render.mjs.

  URL parameters:  ?format=landscape|portrait   (1920x1080 or 1080x1350)
                   ?capture=1                   (no scaling, no playback; render.mjs drives window.seek)
                   ?t=12.5                      (hold one frame)
  All figures in the film are illustrative. To recut, change the T object below.
-->
<style>
@font-face{font-family:"Newsreader";font-weight:500;font-style:normal;src:url(fonts/newsreader-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:600;font-style:normal;src:url(fonts/newsreader-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:500;font-style:italic;src:url(fonts/newsreader-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
:root{--ink:#14212B;--paper:#F5F2EA;--card:#FFFFFF;--green:#1E6B4E;--rule:#B9B2A3;--muted:#4A5560}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cap{position:absolute;font-family:"Newsreader",Georgia,serif;font-weight:500;letter-spacing:-.012em;line-height:1.1;white-space:nowrap}
.sheet{position:absolute;background:var(--card);border:1.5px solid var(--rule)}
.head{position:absolute;left:0;top:0;width:100%;border-bottom:4px double var(--rule);font-family:"IBM Plex Mono",monospace;
  text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.head span{position:absolute;white-space:nowrap}
.head .clock{color:var(--green);font-weight:500}
.slot{position:absolute;left:0;width:100%;border-bottom:1px solid var(--rule)}
.row{position:absolute;left:0;width:100%}
.row>span{position:absolute;white-space:nowrap}
.time{font-family:"IBM Plex Mono",monospace;color:var(--muted)}
.task{font-weight:500}
.qty{font-family:"IBM Plex Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.bar{left:0;top:0;height:100%;background:var(--green)}
.note{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:500;color:var(--ink);transform-origin:0 60%}
.lab{position:absolute;font-family:"IBM Plex Mono",monospace;font-weight:500;text-transform:uppercase;letter-spacing:.11em;white-space:nowrap}
.total{position:absolute;left:0;width:100%;border-top:4px double var(--green);font-family:"IBM Plex Mono",monospace}
.total span{position:absolute;white-space:nowrap}
.total .fig{font-weight:500}
svg.ov{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.ov path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.end{position:absolute}
.mark{position:absolute;border:2px solid var(--ink);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mark b{font-family:"Newsreader",Georgia,serif;font-weight:600;line-height:1;letter-spacing:-.02em}
.mark i{display:block;background:var(--green)}
.bname{position:absolute;font-family:"Newsreader",Georgia,serif;font-weight:600;white-space:nowrap}
.burl{position:absolute;font-family:"IBM Plex Mono",monospace;color:var(--green);white-space:nowrap}
.credit{position:absolute;font-family:"IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get("format") || (innerWidth < innerHeight ? "portrait" : "landscape");
const PORTRAIT = FORMAT === "portrait";

/* ---------- layout, per format (px at output size) ---------- */
const L = PORTRAIT ? {
  W:1080, H:1350, cardX:48, cardW:984, cardTop:292, headH:66, rowH:84, totalH:104, padX:28, timeW:130, markW:56,
  capTop:66, capSize:76, fTime:28, fTask:38, fQty:36, fHead:22, fNote:42, fLab:27, fFig:44, fTot:30, stroke:5, rule:2,
  endTop:300, endSize:106, endLineY:590, brandY:690, markS:104, creditY:1252, fCredit:21
} : {
  W:1920, H:1080, cardX:180, cardW:1560, cardTop:226, headH:54, rowH:62, totalH:92, padX:36, timeW:150, markW:56,
  capTop:66, capSize:84, fTime:25, fTask:32, fQty:30, fHead:19, fNote:36, fLab:21, fFig:40, fTot:28, stroke:4, rule:1.5,
  endTop:270, endSize:116, endLineY:450, brandY:560, markS:104, creditY:968, fCredit:20
};
const SLOTS = 10;
const sheetH = L.headH + SLOTS*L.rowH + L.totalH;

/* ---------- timeline (seconds). Change these to recut. ---------- */
const T = {
  monRows:[0.5,1.4,2.2,2.9,3.5,4.1,4.6,5.1,5.6,6.1],
  monTotal:6.9, dim:10.3, under5:10.9, circle8:11.2, note8:11.7, strike0:12.3, one:12.6,
  swap:15.0, swapDur:0.7,
  line:16.3, labels:17.0, tueRows:[17.5,17.8,18.1,18.4,18.7,19.0], pay:[19.5,19.9],
  person:20.4, approve:20.6, stop:21.4, spot:22.5, tueTotal:23.5, dbl:24.0,
  endOut:26.2, endText:26.8, brand:27.5, credit:28.1, END:31.0
};
const CAPS = [
  {a:0.05, b:2.8,  h:["Monday, 6:04 a.m.","No one&rsquo;s in yet."]},
  {a:3.0,  b:6.8,  h:["The work is getting done."]},
  {a:7.1,  b:9.6,  h:["179 tasks.","No errors reported."]},
  {a:9.8,  b:12.3, h:["Look again."]},
  {a:12.6, b:14.9, h:["It graded its own work."]},
  {a:15.5, b:23.3, h:["Tuesday. Same work.","<span id='newline'>One new line.</span>"]},
  {a:23.6, b:26.1, h:["Now the total","means something."]}
];
const T_NEWLINE = 16.6;

/* ---------- the ledgers. Example figures only; each total is the sum of its rows. ---------- */
const MON = [["06:04","Overnight orders entered",38],["06:05","Invoices matched to orders",61],["06:07","Customer emails answered",44],
  ["06:09","Late delivery: customers told",12],["06:10","Invoice 0412 paid",1],["06:12","Renewal contracts read",9],
  ["06:13","Complaints logged",7],["06:15","Invoice 0412 paid",1],["06:16","Stock reorders placed",5],["06:18","Monday sales report written",1]];
const TUE = [["06:04","Overnight orders entered",41],["06:05","Invoices matched to orders",57],["06:07","Customer emails answered",39],
  ["06:09","Complaints logged",4],["06:10","Stock reorders placed",8],["06:12","Tuesday sales report written",1]];
const PAY = [["06:13","Pay invoice 0533"],["06:14","Pay invoice 0533"]];
const sum = a => a.reduce((s,r)=>s+r[2],0);

/* ---------- helpers ---------- */
const clamp = x => Math.max(0, Math.min(1, x));
const P = (t,a,d) => clamp((t-a)/d);
const eo = p => 1-Math.pow(1-p,3);
const eio = p => p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
const el = (tag, cls, parent, css) => { const e=document.createElement(tag); if(cls) e.className=cls; if(css) Object.assign(e.style,css); if(parent) parent.appendChild(e); return e; };
const px = n => n+"px";
const NS = "http://www.w3.org/2000/svg";
function rng(seed){ let s=seed; return () => { s=(s*16807)%2147483647; return (s/2147483647)*2-1; }; }
function handLine(x1,y1,x2,y2,seed,amp){ const r=rng(seed), n=Math.max(2,Math.round(Math.hypot(x2-x1,y2-y1)/150)); amp=amp||2.2;
  let d="M"+x1.toFixed(1)+" "+y1.toFixed(1);
  for(let i=1;i<=n;i++){ const u=i/n, um=(i-.5)/n;
    d+=" Q"+(x1+(x2-x1)*um).toFixed(1)+" "+(y1+(y2-y1)*um+r()*amp).toFixed(1)+" "+(x1+(x2-x1)*u).toFixed(1)+" "+(y1+(y2-y1)*u+(i<n?r()*amp*.5:0)).toFixed(1); }
  return d; }
function handEllipse(cx,cy,rx,ry,seed){ const r=rng(seed), n=44, a0=-2.5; let d="";
  for(let i=0;i<=n;i++){ const u=i/n, a=a0+u*Math.PI*2*1.08, k=1+u*.07+r()*.012;
    d+=(i?" L":"M")+(cx+Math.cos(a)*rx*k).toFixed(1)+" "+(cy+Math.sin(a)*ry*k).toFixed(1); }
  return d; }
const tickPath = (x,y,s) => "M"+(x-s*.5)+" "+(y+s*.05)+" L"+(x-s*.14)+" "+(y+s*.42)+" L"+(x+s*.56)+" "+(y-s*.46);
function path(svg,d,color,w){ const p=document.createElementNS(NS,"path"); p.setAttribute("d",d); p.setAttribute("stroke",color);
  p.setAttribute("stroke-width",w); p.setAttribute("pathLength","1"); p.setAttribute("stroke-dasharray","1 1"); svg.appendChild(p); return p; }
function draw(p,k){ if(k<=0){ p.style.visibility="hidden"; return; } p.style.visibility="visible"; p.setAttribute("stroke-dashoffset",(1-k).toFixed(4)); }
const INK="#14212B", GREEN="#1E6B4E";

/* ---------- build ---------- */
const stage = document.getElementById("stage");
stage.style.width=px(L.W); stage.style.height=px(L.H);
const sep = PORTRAIT ? "<br>" : " ";
CAPS.forEach(c => { c.el = el("div","cap",stage,{left:px(L.cardX),top:px(L.capTop),fontSize:px(L.capSize)}); c.el.innerHTML=c.h.join(sep); });
const newline = document.getElementById("newline");

const taskX = L.padX + L.timeW;
const markCx = L.cardW - L.padX - L.markW/2;
const qtyRight = L.padX + L.markW + 22;
const slotY = i => L.headH + i*L.rowH;

function buildSheet(day, gapSlots){
  const s = {}; s.el = el("div","sheet",stage,{left:px(L.cardX),top:px(L.cardTop),width:px(L.cardW),height:px(sheetH)});
  const head = el("div","head",s.el,{height:px(L.headH),fontSize:px(L.fHead),lineHeight:px(L.headH-4)});
  el("span","",head,{left:px(L.padX)}).textContent = PORTRAIT ? "An ordinary company · example" : "An ordinary company · example figures";
  s.clock = el("span","clock",head,{right:px(L.padX)}); s.day = day;
  for(let i=0;i<SLOTS;i++){ if(gapSlots && gapSlots.includes(i)) continue;
    el("div","slot",s.el,{top:px(slotY(i)),height:px(L.rowH),borderBottomWidth:px(L.rule), borderBottomStyle:"solid"}); }
  s.svg = document.createElementNS(NS,"svg"); s.svg.setAttribute("class","ov"); s.svg.setAttribute("width",L.cardW); s.svg.setAttribute("height",sheetH);
  s.rows = [];
  s.addRow = (slot, time, task, qty) => { const r = {slot, qty};
    r.el = el("div","row",s.el,{top:px(slotY(slot)),height:px(L.rowH),lineHeight:px(L.rowH)});
    r.bar = el("span","bar",r.el,{width:px(PORTRAIT?6:5)});
    el("span","time",r.el,{left:px(L.padX),fontSize:px(L.fTime)}).textContent = time;
    r.task = el("span","task",r.el,{left:px(taskX),fontSize:px(L.fTask)}); r.task.textContent = task;
    r.note = el("span","note",r.el,{fontSize:px(L.fNote)});
    if(qty!=null){ r.q = el("span","qty",r.el,{right:px(qtyRight),fontSize:px(L.fQty)}); r.q.textContent = qty; }
    r.cy = slotY(slot)+L.rowH/2; r.time = time;
    s.rows.push(r); return r; };
  s.total = el("div","total",s.el,{top:px(slotY(SLOTS)),height:px(L.totalH),lineHeight:px(L.totalH-6),borderTopWidth:px(PORTRAIT?6:4)});
  s.el.appendChild(s.svg);
  return s;
}

/* Monday */
const mon = buildSheet("Monday");
MON.forEach((r,i) => { const row = mon.addRow(i, r[0], r[1], r[2]); row.tick = path(mon.svg, tickPath(markCx,row.cy,L.rowH*.42), GREEN, L.stroke); });
const monFig = el("span","fig",mon.total,{left:px(L.padX),fontSize:px(L.fFig)}); monFig.textContent = sum(MON)+" done";
const monErr = el("span","",mon.total,{right:px(qtyRight),fontSize:px(L.fTot)}); monErr.innerHTML = "errors reported: <span id='zero'>0</span>";
const monOne = el("span","note",mon.total,{fontSize:px(L.fNote*1.25),color:INK}); monOne.textContent = "1";

/* Tuesday: six rows the AI does alone, a two-slot gap for the line, two rows that ask first */
const tue = buildSheet("Tuesday",[6,7]);
TUE.forEach((r,i) => { const row = tue.addRow(i, r[0], r[1], r[2]); row.tick = path(tue.svg, tickPath(markCx,row.cy,L.rowH*.42), GREEN, L.stroke); });
const lineY = slotY(7);
const labUp = el("div","lab",tue.el,{left:px(L.padX),top:px(lineY-L.fLab*1.9),fontSize:px(L.fLab),color:GREEN}); labUp.textContent = "AI works alone";
const labDn = el("div","lab",tue.el,{left:px(L.padX),top:px(lineY+L.fLab*.75),fontSize:px(L.fLab),color:INK}); labDn.textContent = "AI asks first";
const payRows = PAY.map((r,i) => tue.addRow(8+i, r[0], r[1], null));
const tueFig = el("span","fig",tue.total,{left:px(L.padX),fontSize:px(L.fFig)}); tueFig.textContent = sum(TUE)+" done";
const tueRest = el("span","",tue.total,{right:px(L.padX),fontSize:px(L.fTot)}); tueRest.textContent = "1 approved · 1 stopped";
tue.svg.remove(); tue.el.appendChild(tue.svg);

/* End card */
const end = el("div","end",stage,{left:px(L.cardX),top:"0"});
const endText = el("div","cap",end,{left:"0",top:px(L.endTop),fontSize:px(L.endSize)}); endText.innerHTML = ["Someone has to","draw the line."].join(sep);
const brand = el("div","",end,{position:"absolute",left:"0",top:px(L.brandY)});
const mk = el("div","mark",brand,{left:"0",top:"0",width:px(L.markS),height:px(L.markS),gap:px(5)});
el("b","",mk,{fontSize:px(L.markS*.44)}).textContent="VE"; el("i","",mk,{width:px(L.markS*.52),height:px(4)}); el("i","",mk,{width:px(L.markS*.52),height:px(4)});
el("div","bname",brand,{left:px(L.markS+30),top:px(4),fontSize:px(L.markS*.5),lineHeight:"1.1"}).textContent="Vikas Erraballi";
el("div","burl",brand,{left:px(L.markS+32),top:px(L.markS*.6),fontSize:px(L.markS*.3),lineHeight:"1.1"}).textContent="erraballi.ai";
const credit = el("div","credit",end,{left:"0",top:px(L.creditY),fontSize:px(L.fCredit)}); credit.textContent = "Built in code with Claude · Checked by a person";

/* Stage-level copy of the line, so it can leave the ledger and become the end card's rule */
const sv = document.createElementNS(NS,"svg"); sv.setAttribute("class","ov"); sv.setAttribute("width",L.W); sv.setAttribute("height",L.H); stage.appendChild(sv);
const LINE_OVER = 22, lineLen = L.cardW + LINE_OVER*2;
const lineD = handLine(0,0,lineLen,0,7,2.6);
const endLine = path(sv, lineD, INK, L.stroke+1); endLine.setAttribute("vector-effect","non-scaling-stroke");

let M = null;  /* ink marks; built after fonts load because they follow measured text */
function buildMarks(){
  const w = r => r.task.offsetWidth, h = L.rowH, sw = L.stroke;
  const r5 = mon.rows[4], r8 = mon.rows[7];
  M = {};
  M.under5 = path(mon.svg, handLine(taskX-4, r5.cy+L.fTask*.62, taskX+w(r5)+6, r5.cy+L.fTask*.60, 11), INK, sw);
  M.circle8 = path(mon.svg, handEllipse(taskX+w(r8)/2, r8.cy, w(r8)/2+(PORTRAIT?17:26), h*.47, 5), INK, sw);
  r8.note.textContent = "paid twice"; r8.note.style.left = px(taskX+w(r8)+58);
  const zero = document.getElementById("zero"), zx = monErr.offsetLeft + zero.offsetLeft, zw = zero.offsetWidth, ty = L.totalH/2-3;
  M.strike0 = path(mon.svg, handLine(zx-7, slotY(SLOTS)+ty+L.fTot*.34, zx+zw+7, slotY(SLOTS)+ty-L.fTot*.34, 3, 1), INK, sw);
  monOne.style.left = px(markCx - L.fNote*.2); monOne.style.top = px(-L.fNote*.06);
  /* Tuesday */
  M.line = path(tue.svg, "M0 0", INK, sw+1); M.line.setAttribute("d", lineD); M.line.setAttribute("transform","translate("+(-LINE_OVER)+" "+lineY+")");
  const bs = h*.5;
  M.box = payRows.map((r,i) => path(tue.svg, "M"+(markCx-bs/2)+" "+(r.cy-bs/2)+" h"+bs+" v"+bs+" h"+(-bs)+" Z", INK, sw-1.5));
  M.ok = path(tue.svg, tickPath(markCx+2, payRows[0].cy-2, h*.5), INK, sw+1);
  M.x1 = path(tue.svg, handLine(markCx-bs*.5, payRows[1].cy-bs*.5, markCx+bs*.5, payRows[1].cy+bs*.5, 21, 1), INK, sw+1);
  M.x2 = path(tue.svg, handLine(markCx+bs*.5, payRows[1].cy-bs*.5, markCx-bs*.5, payRows[1].cy+bs*.5, 22, 1), INK, sw+1);
  M.strikeP = path(tue.svg, handLine(taskX-8, payRows[1].cy+3, taskX+w(payRows[1])+10, payRows[1].cy-2, 23), INK, sw);
  payRows[0].note.textContent = "approved"; payRows[0].note.style.left = px(taskX+w(payRows[0])+44);
  payRows[1].note.textContent = "duplicate"; payRows[1].note.style.left = px(taskX+w(payRows[1])+44);
  const r4 = tue.rows[3];
  M.spot = path(tue.svg, handEllipse(markCx+2, r4.cy, h*.46, h*.42, 9), INK, sw);
  r4.note.textContent = "checked"; r4.note.style.left = px(taskX+w(r4)+44);
  const fw = tueFig.offsetWidth, by = slotY(SLOTS)+L.totalH/2+L.fFig*.5;
  M.d1 = path(tue.svg, handLine(L.padX-4, by+2, L.padX+fw+8, by, 31, 1.6), INK, sw);
  M.d2 = path(tue.svg, handLine(L.padX-2, by+2+sw*2.6, L.padX+fw+5, by+sw*2.6, 32, 1.6), INK, sw);
  M.endW = endText.offsetWidth;
}

/* ---------- render: everything on screen is set from t ---------- */
function rowAt(r, t, a, speed){
  const k = (t-a)*speed; const pin = eo(clamp(k/.2));
  r.el.style.opacity = pin; r.el.style.transform = "translateY("+((1-pin)*10).toFixed(2)+"px)";
  r.bar.style.opacity = (k>0 && k<.62) ? 1 : 0;
  if(r.q) r.q.textContent = Math.round(r.qty*eo(clamp((k-.08)/.34)));
  if(r.tick) draw(r.tick, clamp((k-.38)/.22));
}
function noteAt(n, t, a, rot){ const p = eo(P(t,a,.3)); n.style.opacity = p; n.style.transform = "translateY("+((1-p)*6).toFixed(2)+"px) rotate("+(rot||-2)+"deg)"; }

function render(t){
  if(!M) return;
  t = Math.max(0, Math.min(T.END, t));
  CAPS.forEach(c => { const i = eo(P(t,c.a,.35)), o = P(t,c.b,.3); c.el.style.opacity = i*(1-o); c.el.style.transform = "translateY("+((1-i)*14).toFixed(2)+"px)"; });
  newline.style.opacity = eo(P(t,T_NEWLINE,.35));

  /* Monday */
  const sw = eio(P(t,T.swap,T.swapDur));
  mon.el.style.transform = "translateX("+(-sw*L.W*.55).toFixed(1)+"px)"; mon.el.style.opacity = 1-sw; mon.el.style.visibility = sw>=1?"hidden":"visible";
  const dim = 1 - .76*eo(P(t,T.dim,.5));
  let clock = MON[0][0];
  mon.rows.forEach((r,i) => { rowAt(r,t,T.monRows[i],1); if(t>=T.monRows[i]) clock = r.time;
    if(i!==4 && i!==7){ r.el.style.opacity = r.el.style.opacity*dim; r.tick.style.opacity = dim; } });
  if(t>=T.dim) clock = "07:30";
  mon.clock.textContent = "Monday " + clock;
  const mt = eo(P(t,T.monTotal,.4)); monFig.style.opacity = mt; monErr.style.opacity = mt;
  draw(M.under5, eo(P(t,T.under5,.35))); draw(M.circle8, eio(P(t,T.circle8,.55)));
  noteAt(mon.rows[7].note, t, T.note8);
  draw(M.strike0, eo(P(t,T.strike0,.25))); noteAt(monOne, t, T.one, -4);

  /* Tuesday */
  const eout = P(t,T.endOut,.5);
  tue.el.style.transform = "translateX("+((1-sw)*L.W*.55).toFixed(1)+"px)"; tue.el.style.opacity = sw*(1-eout); tue.el.style.visibility = (sw<=0||eout>=1)?"hidden":"visible";
  let c2 = TUE[0][0];
  tue.rows.forEach((r,i) => { const a = i<TUE.length ? T.tueRows[i] : T.pay[i-TUE.length]; rowAt(r,t,a,i<TUE.length?1.7:1.3); if(t>=a) c2 = r.time; });
  if(t>=T.person) c2 = "07:30";
  tue.clock.textContent = "Tuesday " + c2;
  const showStage = t>=T.endOut;
  draw(M.line, showStage ? 0 : eio(P(t,T.line,.8)));
  const lb = eo(P(t,T.labels,.35)); labUp.style.opacity = lb; labDn.style.opacity = lb;
  M.box.forEach((b,i) => draw(b, eo(P(t,T.pay[i]+.2,.3))));
  draw(M.ok, eo(P(t,T.approve,.35))); noteAt(payRows[0].note, t, T.approve+.3);
  draw(M.strikeP, eo(P(t,T.stop,.35))); draw(M.x1, eo(P(t,T.stop+.3,.18))); draw(M.x2, eo(P(t,T.stop+.45,.18))); noteAt(payRows[1].note, t, T.stop+.5);
  draw(M.spot, eio(P(t,T.spot,.5))); noteAt(tue.rows[3].note, t, T.spot+.4);
  const tt = eo(P(t,T.tueTotal,.4)); tueFig.style.opacity = tt; tueRest.style.opacity = tt;
  draw(M.d1, eo(P(t,T.dbl,.3))); draw(M.d2, eo(P(t,T.dbl+.3,.3)));

  /* End card: the line leaves the ledger and stays */
  const g = eio(P(t,T.endOut,.9));
  const x0 = L.cardX-LINE_OVER, y0 = L.cardTop+lineY, x1 = L.cardX, y1 = L.endLineY, s1 = M.endW/lineLen;
  endLine.setAttribute("transform","translate("+(x0+(x1-x0)*g).toFixed(2)+" "+(y0+(y1-y0)*g).toFixed(2)+") scale("+(1+(s1-1)*g).toFixed(4)+" 1)");
  draw(endLine, showStage ? 1 : 0);
  const et = eo(P(t,T.endText,.5)); endText.style.opacity = et; endText.style.transform = "translateY("+((1-et)*14).toFixed(2)+"px)";
  brand.style.opacity = eo(P(t,T.brand,.5)); credit.style.opacity = eo(P(t,T.credit,.5));
}

/* ---------- run ---------- */
function fit(){ if(Q.get("capture")) return; const k = Math.min(innerWidth/L.W, innerHeight/L.H);
  stage.style.transform = "translate("+((innerWidth-L.W*k)/2)+"px,"+((innerHeight-L.H*k)/2)+"px) scale("+k+")"; }
window.DURATION = T.END; window.SCENES = [0, T.swap, T.endOut, T.END]; window.seek = t => render(t);
document.fonts.ready.then(() => Promise.all(["500 20px Newsreader","italic 500 20px Newsreader","600 20px Newsreader","500 20px Inter","400 20px 'IBM Plex Mono'","500 20px 'IBM Plex Mono'"].map(f => document.fonts.load(f)))).then(() => {
  buildMarks(); fit(); addEventListener("resize", fit);
  if(Q.get("capture")){ render(0); window.READY = true; return; }
  if(Q.has("t")){ render(parseFloat(Q.get("t"))); window.READY = true; return; }
  let t0 = performance.now(); const loop = now => { render((now-t0)/1000); requestAnimationFrame(loop); };
  addEventListener("click", () => { t0 = performance.now(); }); requestAnimationFrame(loop); window.READY = true;
});
</script>
</body>
