<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clip source: A meeting in, a plan out · erraballi.ai</title>
<!--
  Source page for the 12-second clip "A meeting in, a plan out" (Horizon brand). Everything is drawn in code.
  The clip is a pure function of time: render(t) builds every frame from t. Open this page to watch it live.
  To film it: node clips/render.mjs meeting landscape|portrait   (see clips/render.mjs)
  URL parameters: ?format=landscape|portrait (1600x900 or 1080x1350), ?capture=1, ?t=6.5
  Facts shown: a one-hour recorded meeting became a 10-page requirements document, with owners and risks.
  The page content is a skeleton on purpose: no real names, no real requirements. To recut, change T and CAPS.
-->
<style>
@font-face{font-family:"Space Grotesk";font-weight:600;src:url(../../hero/fonts/space-grotesk-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url(../../hero/fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(../../hero/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1B2B;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#0B1B2B;color:#F6F8FA;overflow:hidden;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage div{position:absolute}
.cap{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.cap em{font-style:normal;color:#F2A33A}
.mono{font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const Q=new URLSearchParams(location.search);
const FORMAT=Q.get("format")||(innerWidth<innerHeight?"portrait":"landscape");
const PORT=FORMAT==="portrait";
const L=PORT?{W:1080,H:1350,capX:72,capY:84,capS:74,rec:{x:72,y:330,w:936,h:230},doc:{x:240,y:650,w:600},mono:24}
            :{W:1600,H:900,capX:96,capY:80,capS:64,rec:{x:96,y:340,w:600,h:300},doc:{x:900,y:150,w:600},mono:22};
const T={rec0:0.4,rec1:3.2,flow0:3.2,flow1:4.6,doc0:4.0,build0:4.6,build1:8.6,hi:9.2,out:11.5,END:12};
const CAPS=[{a:0.3,b:3.2,h:["A one-hour meeting,","recorded."]},{a:3.4,b:5.6,h:["AI wrote it up."]},
  {a:5.8,b:9.0,h:["A <em>10-page</em>","requirements document."]},{a:9.2,b:11.5,h:["With <em>owners</em>","and <em>risks</em>."]}];
const clamp=x=>Math.max(0,Math.min(1,x)),P=(t,a,d)=>clamp((t-a)/d),eo=p=>1-Math.pow(1-p,3),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const box=(x,y,w,h,css)=>`<div style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${css||""}"></div>`;
const NB=PORT?64:46;

function render(t){
  let h="";
  const all=Math.min(P(t,0,0.3),1-P(t,T.out,T.END-T.out-0.05));
  /* captions */
  for(const c of CAPS){const o=Math.min(eo(P(t,c.a,0.35)),1-P(t,c.b-0.25,0.25));if(o<=0)continue;
    h+=`<div class="cap" style="left:${L.capX}px;top:${L.capY+(1-o)*14}px;font-size:${L.capS}px;opacity:${o}">${c.h.join("<br>")}</div>`;}
  /* recorder */
  const r=L.rec,rp=P(t,T.rec0,T.rec1-T.rec0),secs=Math.round(eio(rp)*3600),done=rp>=1;
  const mm=String(Math.floor(secs/60)%60).padStart(2,"0"),ss=String(secs%60).padStart(2,"0"),hh=Math.floor(secs/3600);
  const drain=eio(P(t,T.flow0,T.flow1-T.flow0)),recO=1-0.55*drain;
  const blink=done?0.35:(Math.floor(t*2)%2?1:0.35);
  h+=`<div class="mono" style="left:${r.x}px;top:${r.y}px;font-size:${L.mono}px;color:#A9B8C8;opacity:${recO}"><span style="color:#F2A33A;opacity:${blink}">●</span>&nbsp; ${done?"Recorded":"Rec"} &nbsp;${hh}:${mm}:${ss}</div>`;
  const by=r.y+60,bh=r.h-60,gap=r.w/NB,bw=Math.max(4,gap*0.46);
  for(let i=0;i<NB;i++){const shown=clamp(rp*NB-i),amp=(0.18+0.82*rnd(i))*(0.55+0.45*Math.sin(i*0.5+1)**2);
    const live=!done&&i>rp*NB-3?1+0.25*Math.sin(t*22+i):1,hgt=Math.max(4,bh*amp*shown*live);
    const lit=drain>0&&Math.abs(i/NB-drain)<0.09&&drain<1;
    h+=box(r.x+i*gap,by+(bh-hgt)/2,bw,hgt,`border-radius:${bw/2}px;background:${lit?"#F2A33A":"#5B6E82"};opacity:${shown*recO}`);}
  /* document */
  const d=L.doc,u=d.w/630,dh=640*u,dp=eo(P(t,T.doc0,0.7)),bp=P(t,T.build0,T.build1-T.build0),hi=eo(P(t,T.hi,0.5));
  const pages=Math.max(1,Math.min(10,1+Math.floor(bp*9.999)));
  if(dp>0){const dy=d.y+(1-dp)*30;
    for(let k=Math.min(3,Math.ceil((pages-1)/3));k>=1;k--)h+=box(d.x+k*9*u,dy+k*9*u,d.w,dh,`border-radius:${8*u}px;background:#D5DEE8;opacity:${dp*(1-k*0.22)}`);
    h+=`<div style="left:${d.x}px;top:${dy}px;width:${d.w}px;height:${dh}px;border-radius:${8*u}px;background:#F6F8FA;opacity:${dp};overflow:hidden">`;
    const step=(n,of)=>eo(clamp(bp*of-n)),line=(y,w,n,of,c)=>box(44*u,y*u,w*u*step(n,of),9*u,`border-radius:${5*u}px;background:${c||"#C3CEDA"}`);
    const N=13;
    h+=`<div style="left:${44*u}px;top:${38*u}px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:${36*u}px;color:#0B1B2B;opacity:${step(0,N)}">Requirements</div>`;
    h+=line(110,540,1,N)+line(134,500,2,N)+line(158,330,3,N);
    h+=`<div class="mono" style="left:${44*u}px;top:${206*u}px;font-size:${13*u}px;color:#3A4A5C;opacity:${step(4,N)}">Requirement</div>`;
    h+=`<div class="mono" style="left:${330*u}px;top:${206*u}px;font-size:${13*u}px;color:${hi>0.5?"#0B1B2B":"#3A4A5C"};opacity:${step(4,N)}">Owner</div>`;
    h+=`<div class="mono" style="left:${500*u}px;top:${206*u}px;font-size:${13*u}px;color:${hi>0.5?"#0B1B2B":"#3A4A5C"};opacity:${step(4,N)}">Risk</div>`;
    h+=box(44*u,232*u,542*u*step(4,N),1.5*u,"background:#C3CEDA");
    const risk=[2,1,3,1];
    for(let i=0;i<4;i++){const y=(250+i*58)*u,s=step(5+i,N),w=[230,190,250,170][i];
      h+=box(44*u,y+10*u,w*u*s,9*u,`border-radius:${5*u}px;background:#C3CEDA`)+box(44*u,y+28*u,(w-70)*u*s,9*u,`border-radius:${5*u}px;background:#D5DEE8`);
            h+=`<div style="left:${330*u}px;top:${y+4*u}px;width:${130*u}px;height:${36*u}px;border-radius:${18*u}px;border:${2*u}px solid ${hi>0?"#F2A33A":"#C3CEDA"};background:${hi>0?`rgba(242,163,58,${0.16*hi})`:"transparent"};opacity:${s};transform:scale(${1+0.04*hi*Math.sin((t-T.hi)*6-i)})">`
        +box(8*u,6*u,20*u,20*u,`border-radius:50%;background:#0B1B2B`)+box(36*u,12*u,[70,56,76,60][i]*u,8*u,`border-radius:${4*u}px;background:#3A4A5C`)+`</div>`;
      for(let k=0;k<3;k++)h+=box((500+k*22)*u,y+13*u,16*u,16*u,`border-radius:${3*u}px;background:${k<risk[i]?(hi>0?"#F2A33A":"#3A4A5C"):"#D5DEE8"};opacity:${s}`);
      h+=box(44*u,y+50*u,542*u*s,1*u,"background:#E6ECF2");}
    h+=line(500,520,9,N)+line(524,470,10,N)+line(548,280,11,N);
    h+=`<div class="mono" style="left:${44*u}px;top:${594*u}px;font-size:${13*u}px;color:#3A4A5C;opacity:${step(1,N)}">Page ${pages} of 10</div>`;
    h+=`</div>`;}
  /* flow: a dot from the recording to the page */
  const fp=P(t,T.flow0+0.2,T.flow1-T.flow0);
  if(fp>0&&fp<1){const ax=PORT?r.x+r.w/2:r.x+r.w,ay=PORT?r.y+r.h:r.y+60+(r.h-60)/2,bx=PORT?d.x+d.w/2:d.x,by2=PORT?d.y:d.y+dh/2,e=eio(fp);
    for(let k=0;k<6;k++){const q=clamp(e-k*0.05),s=14-k*2;h+=box(ax+(bx-ax)*q-s/2,ay+(by2-ay)*q-s/2,s,s,`border-radius:50%;background:#F2A33A;opacity:${(1-k/6)*Math.sin(Math.PI*fp)}`);}}
  stage.innerHTML=h;stage.style.opacity=all;
}
const stage=document.getElementById("stage");stage.style.width=L.W+"px";stage.style.height=L.H+"px";
window.END=T.END;window.seek=render;
document.fonts.load('600 20px "Space Grotesk"').then(()=>document.fonts.load('500 20px "IBM Plex Mono"')).then(()=>document.fonts.ready).then(()=>{
  if(Q.get("capture")){render(0);window.READY=true;return;}
  const fit=()=>{const s=Math.min(innerWidth/L.W,innerHeight/L.H);stage.style.transform=`translate(${(innerWidth-L.W*s)/2}px,${(innerHeight-L.H*s)/2}px) scale(${s})`;};
  fit();addEventListener("resize",fit);
  if(Q.get("t")){render(Number(Q.get("t")));return;}
  const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%T.END);requestAnimationFrame(loop);})();
});
</script>
</body>
</html>
